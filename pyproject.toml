[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "terratwin-ai"
version = "0.1.0"
description = "Reproducible, explainable terrain analog shortlisting"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<3", "pydantic>=2.10,<3",
  "PyYAML>=6,<7", "scipy>=1.14,<2", "rasterio>=1.4,<2",
  "pyproj>=3.7,<4", "geopandas>=1,<2", "pyarrow>=18,<24",
  "streamlit>=1.44,<2", "pydeck>=0.9,<1", "affine>=2.4,<3", "requests>=2.32,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
